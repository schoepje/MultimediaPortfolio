<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoshop Portfolio</title>
    <style>
        /* Base Reset & Core Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a1d00, #8b3d00); /* Dark orange gradient background */
            color: #ffffff; /* Crisp white text */
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Navigation Bar */
        nav {
            background-color: #1a1a1a;
            border-bottom: 3px solid #7ed321; /* Lighter green accent */
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #7ed321; /* Lighter green accent */
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, 
        .nav-links a.active {
            color: #7ed321; /* Light green accent on hover/active */
        }

        /* Header Banner (Slideshow with Auto Box Size Correction) */
        .banner-slideshow {
            width: 100%;
            height: 350px;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            background-color: #111111; /* Fallback background color */
        }

        .slides {
            display: flex;
            width: 400%; /* Adjusted to 400% for 4 images */
            height: 100%;
            animation: slideAnimation 20s infinite; /* Adjusted duration for 4 images */
        }

        .slide {
            width: 25%; /* Adjusted to 25% for 4 images */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* AUTOMATIC IMAGE BOX SIZE CORRECTION: Fits completely without stretching */
        }

        /* Adjusted Keyframes for 4 even slides */
        @keyframes slideAnimation {
            0% { transform: translateX(0%); }
            20% { transform: translateX(0%); }
            25% { transform: translateX(-25%); }
            45% { transform: translateX(-25%); }
            50% { transform: translateX(-50%); }
            70% { transform: translateX(-50%); }
            75% { transform: translateX(-75%); }
            95% { transform: translateX(-75%); }
            100% { transform: translateX(0%); }
        }

        /* Main Content Layout */
        .main-content {
            margin-top: 30px;
            background-color: #262626; /* Dark gray content card */
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* Profile Image Column */
        .profile-col {
            flex: 0 0 250px;
        }

        .profile-img-container {
            width: 100%;
            aspect-ratio: 1 / 1; /* Enforces a perfect square container */
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #7ed321; /* Light green accent border */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* AUTOMATIC IMAGE SIZE CORRECTION: Fills perfectly without distortion */
        }

        /* Bio/Paragraphs Column */
        .bio-col {
            flex: 1;
        }

        .bio-col h1 {
            color: #7ed321;
            margin-bottom: 20px;
            font-size: 2rem;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }

        .bio-paragraph {
            background-color: #1f1f1f;
            border-left: 4px solid #7ed321;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            font-size: 1.05rem;
        }

        .placeholder-text {
            color: #aaaaaa;
            font-style: italic;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            .banner-slideshow {
                height: 200px;
            }
            .main-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 20px;
            }
            .profile-col {
                flex: 0 0 auto;
                width: 200px;
            }
            .bio-paragraph {
                border-left: none;
                border-top: 4px solid #7ed321;
                border-radius: 0 0 8px 8px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">Portfolio</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="photoshop.html" class="active">Photoshop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Header Banner Slideshow with 4 images -->
        <div class="banner-slideshow">
            <div class="slides">
                <div class="slide">
                    <img src="SocialMediaPost1.png".jpg" alt="Photoshop Artwork 1">
                </div>
                <div class="slide">
                    <img src="SocialMediaPost2.png" alt="Photoshop Artwork 2">
                </div>
                <div class="slide">
                    <img src="SocialMediaPost3.png" alt="Photoshop Artwork 3">
                </div>
                <div class="slide">
                    <img src="SocialMediaPost4.png" alt="Photoshop Artwork 4">
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="profile-col">
                <div class="profile-img-container">
                    <!-- Replace with your actual profile image filename if needed -->
                    <img src="profile.jpg" alt="Profile Image" class="profile-img">
                </div>
            </div>
            
            <div class="bio-col">
                <h1>My Photoshop Work</h1>
                
                <!-- Empty paragraph block left open for your personal text -->
                <p class="bio-paragraph"></p>
                
            </div>
        </main>
    </div>

</body>
</html>
